<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF7CC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle (Manifold) -->
  <!-- Outer Ring representing the Chhandas (Meter) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGradient)" stroke-width="8" />
  
  <!-- Stylized Sanskrit/Musical Notes on the Ring -->
  <!-- Represented abstractly as orbital dashes and dots -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFD700" stroke-width="2" stroke-dasharray="10 20 5 20" opacity="0.6" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="40 10" opacity="0.4" />

  <!-- The Eternal Light (Flame) -->
  <g filter="url(#glow)">
    <!-- Main Flame Base -->
    <path d="M256 100 
             C 256 100, 320 200, 320 300 
             C 320 380, 290 420, 256 420 
             C 220 420, 190 380, 190 300 
             C 190 200, 256 100, 256 100 Z" 
          fill="url(#goldGradient)" />
    
    <!-- Inner Flame Core (The Truth/Abhedya) -->
    <path d="M256 180 
             C 256 180, 290 250, 290 310 
             C 290 360, 270 390, 256 390 
             C 240 390, 220 360, 220 310 
             C 220 250, 256 180, 256 180 Z" 
          fill="#FFF" opacity="0.8" />
  </g>

  <!-- Text: ABHEDYAM (Optional, remove if icon-only preferred) -->
  <!-- Commented out to keep it pure icon based, user can add text in CSS -->
</svg>
