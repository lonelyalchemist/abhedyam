<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <linearGradient id="flameGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" /> <!-- Dark Orange Base -->
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" /> <!-- Gold Body -->
      <stop offset="100%" style="stop-color:#FFF7CC;stop-opacity:1" /> <!-- White Tip -->
    </linearGradient>
    <radialGradient id="ringGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="70%" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="90%" style="stop-color:#4169E1;stop-opacity:0.3" /> <!-- Royal Blue Glow -->
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0.6" />
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Horizontal Musical Plane (Perspective Ellipse) -->
  <g transform="translate(256, 380)">
    <!-- Back arc of the ring (behind the flame) -->
    <path d="M -200 0 A 200 60 0 0 1 200 0" fill="none" stroke="url(#ringGradient)" stroke-width="4" opacity="0.5" />
    
    <!-- Musical/Sanskrit Orbital Paths -->
    <ellipse cx="0" cy="0" rx="180" ry="54" fill="none" stroke="#FFD700" stroke-width="2" stroke-dasharray="10 30" opacity="0.4" />
    <ellipse cx="0" cy="0" rx="220" ry="66" fill="none" stroke="#4169E1" stroke-width="1" stroke-dasharray="5 15" opacity="0.3" />
  </g>

  <!-- The Vertical Eternal Flame -->
  <!-- Positioned to rise from the center of the ellipse -->
  <g filter="url(#softGlow)" transform="translate(256, 380)">
    <!-- Flame Path: Rising High -->
    <path d="M 0 0 
             C 40 -50, 60 -150, 0 -280 
             C -60 -150, -40 -50, 0 0 Z" 
          fill="url(#flameGradient)" />
    
    <!-- Inner Core -->
    <path d="M 0 -20 
             C 20 -60, 30 -120, 0 -220 
             C -30 -120, -20 -60, 0 -20 Z" 
          fill="#FFF" opacity="0.7" />
  </g>

  <!-- Front arc of the ring (visual depth overlay) -->
  <g transform="translate(256, 380)">
    <path d="M 200 0 A 200 60 0 0 1 -200 0" fill="none" stroke="url(#ringGradient)" stroke-width="6" opacity="0.8" />
  </g>
</svg>
